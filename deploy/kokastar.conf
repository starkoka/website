# The first vhost rejects unknown Host headers rather than serving the app.
<VirtualHost *:80>
    ServerName default.invalid
    <Location />
        Require all denied
    </Location>
</VirtualHost>

<VirtualHost *:80>
    ServerName kokastar.dev
    DocumentRoot /var/www/kokastar-acme
    <Directory /var/www/kokastar-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://kokastar.dev%{REQUEST_URI} [R=301,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/kokastar-error.log
    CustomLog ${APACHE_LOG_DIR}/kokastar-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName kokastar.dev
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/kokastar.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/kokastar.dev/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCompression off
    SSLSessionTickets off
    Header always set Strict-Transport-Security "max-age=31536000"
    <If "%{HTTP_HOST} !~ /^kokastar\.dev(?::443)?$/">
        Require all denied
    </If>
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # Serve the live generated report, independently of Next.js releases.
    ProxyPassMatch "^/kosenRBKN-HPDiff\.html$" "!"
    AliasMatch "^/kosenRBKN-HPDiff\.html$" "/var/www/kokastar_generated/kosenRBKN-HPDiff.html"
    <Directory /var/www/kokastar_generated>
        Options None
        AllowOverride None
        Require all denied
        <Files "kosenRBKN-HPDiff.html">
            Require all granted
            ForceType text/html
        </Files>
    </Directory>
    <LocationMatch "^/kosenRBKN-HPDiff\.html$">
        Header always set Cache-Control "no-store"
    </LocationMatch>
    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:3000/
    ErrorLog ${APACHE_LOG_DIR}/kokastar-error.log
    CustomLog ${APACHE_LOG_DIR}/kokastar-access.log combined
</VirtualHost>
