# Temporary HTTP vhost for ACME validation before enabling origin TLS.
<VirtualHost *:80>
    ServerName default.invalid
    <Location />
        Require all denied
    </Location>
</VirtualHost>
<VirtualHost *:80>
    ServerName kokastar.dev
    DocumentRoot /var/www/kokastar-acme
    <Directory /var/www/kokastar-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ - [R=503,L]
</VirtualHost>
