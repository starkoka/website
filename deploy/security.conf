ServerTokens Prod
ServerSignature Off
TraceEnable Off
ServerName kokastar.dev
Timeout 30
KeepAliveTimeout 2
LimitRequestBody 1048576
Header always unset X-Powered-By
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
ErrorDocument 500 "The site is temporarily unavailable. Please try again later."
ErrorDocument 502 "The site is temporarily unavailable. Please try again later."
ErrorDocument 503 "The site is temporarily unavailable. Please try again later."
ErrorDocument 504 "The site is temporarily unavailable. Please try again later."
<Directory /var/www/>
    Options -Indexes -Includes -ExecCGI
    AllowOverride None
</Directory>
<LocationMatch "(?i)(^|/)(\.(?!well-known(?:/|$))[^/]*|server-status|server-info)(/|$)">
    Require all denied
</LocationMatch>
